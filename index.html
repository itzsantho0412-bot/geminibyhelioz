<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>HELIOZ AI - Personal Growth Partner</title>
<meta name="description" content="HELIOZ AI: your personal growth companion in Tamil, English and Tanglish." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Cinzel:wght@700&display=swap" rel="stylesheet" />
<style>
  :root { color-scheme: dark; --gold: #f59e0b; --bg: #000; --panel: #0f172a; --line: #1e293b; --text: #f1f5f9; --muted: #94a3b8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px; display: flex; flex-direction: column; min-height: 100vh; gap: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-family: Cinzel, serif; font-size: 1.6rem; margin: 0; color: var(--gold); letter-spacing: .05em; }
  .status { font-size: .8rem; color: var(--muted); }
  .btn { background: var(--gold); color: #000; border: 0; border-radius: 999px; padding: 10px 16px; font-weight: 600; cursor: pointer; font-size: .95rem; }
  .btn.ghost { background: transparent; color: var(--gold); border: 1px solid var(--gold); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.rec { background: #ef4444; color: #fff; }
  #log { flex: 1; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; padding: 4px; min-height: 40vh; }
  .msg { max-width: 85%; padding: 12px 14px; border-radius: 14px; white-space: pre-wrap; line-height: 1.5; font-size: .95rem; }
  .user { align-self: flex-end; background: #1e293b; }
  .bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
  .bot .speak { margin-top: 8px; font-size: .8rem; color: var(--gold); background: none; border: 0; padding: 0; cursor: pointer; }
  .composer { display: flex; gap: 8px; align-items: center; }
  input[type=text] { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; }
  input[type=text]:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .empty { color: var(--muted); text-align: center; margin-top: 10vh; font-size: .95rem; }
  .err { color: #fca5a5; font-size: .85rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>HELIOZ AI</h1>
      <div class="status" id="status">Checking…</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn ghost" id="introBtn">▶ Intro</button>
      <button class="btn ghost" id="clearBtn">Clear</button>
    </div>
  </header>

  <div id="log"><div class="empty" id="empty">Say “vanakkam”, ask for a plan, or type anything in Tamil, English or Tanglish.</div></div>

  <div class="err" id="err"></div>

  <form class="composer" id="form">
    <button type="button" class="btn ghost" id="micBtn" title="Speak">🎙</button>
    <input type="text" id="input" placeholder="Type here…" autocomplete="off" />
    <button class="btn" id="sendBtn" type="submit">Send</button>
  </form>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const log = $('log'), input = $('input'), statusEl = $('status'), errEl = $('err');
  const micBtn = $('micBtn'), sendBtn = $('sendBtn');
  const history = [];
  let recorder = null, chunks = [], introAudio = null, currentTTS = null;

  const showError = (msg) => { errEl.textContent = msg || ''; };

  const addMessage = (text, who) => {
    $('empty') && $('empty').remove();
    const div = document.createElement('div');
    div.className = 'msg ' + who;
    div.textContent = text;
    if (who === 'bot') {
      const btn = document.createElement('button');
      btn.className = 'speak';
      btn.textContent = '🔊 Speak';
      btn.onclick = () => speak(text);
      div.appendChild(btn);
    }
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  };

  async function api(path, body) {
    const r = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || `Request failed (${r.status})`);
    return data;
  }

  async function checkHealth() {
    try {
      const r = await fetch('/api/health');
      const d = await r.json();
      statusEl.textContent = d.hasApiKey ? 'Ready' : 'Server running, GEMINI_API_KEY is missing';
    } catch {
      statusEl.textContent = 'API unreachable. Open this page from the deployed site, not a local file.';
    }
  }

  async function send(text) {
    text = (text || '').trim();
    if (!text) return;
    showError('');
    addMessage(text, 'user');
    history.push({ sender: 'user', text });
    input.value = '';
    sendBtn.disabled = true;
    try {
      const d = await api('/api/gemini/chat', { message: text, history: history.slice(-6, -1) });
      const reply = d.reply || '';
      history.push({ sender: 'bot', text: reply });
      addMessage(reply, 'bot');
    } catch (e) {
      showError(e.message);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  async function speak(text) {
    showError('');
    try {
      if (currentTTS) { currentTTS.pause(); currentTTS = null; }
      const d = await api('/api/gemini/tts', { text });
      const audio = new Audio(`data:${d.mimeType};base64,${d.audioBase64}`);
      currentTTS = audio;
      await audio.play();
    } catch (e) {
      showError('Voice playback failed: ' + e.message);
    }
  }

  async function toggleMic() {
    if (recorder && recorder.state === 'recording') {
      recorder.stop();
      micBtn.classList.remove('rec');
      return;
    }
    if (!navigator.mediaDevices?.getUserMedia) {
      showError('Microphone is not supported in this browser.');
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
      recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
      chunks = [];
      recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
      recorder.onstop = async () => {
        stream.getTracks().forEach((t) => t.stop());
        const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
        await transcribe(blob);
      };
      recorder.start();
      micBtn.classList.add('rec');
      showError('Listening… tap 🎙 again to stop.');
    } catch (e) {
      showError('Microphone permission denied.');
    }
  }

  async function transcribe(blob) {
    showError('Transcribing…');
    try {
      const base64 = await new Promise((res, rej) => {
        const fr = new FileReader();
        fr.onload = () => res(fr.result.split(',')[1]);
        fr.onerror = () => rej(new Error('Could not read audio'));
        fr.readAsDataURL(blob);
      });
      const d = await api('/api/gemini/transcribe', { audioBase64: base64, mimeType: blob.type });
      showError('');
      if (d.text) await send(d.text);
      else showError('Could not hear anything. Try again.');
    } catch (e) {
      showError('Transcription failed: ' + e.message);
    }
  }

  $('form').addEventListener('submit', (e) => { e.preventDefault(); send(input.value); });
  micBtn.addEventListener('click', toggleMic);
  $('introBtn').addEventListener('click', () => {
    if (!introAudio) introAudio = new Audio('/audio/intro.mp3');
    if (introAudio.paused) introAudio.play(); else introAudio.pause();
  });
  $('clearBtn').addEventListener('click', () => {
    history.length = 0;
    log.innerHTML = '';
    showError('');
  });

  checkHealth();
})();
</script>
</body>
</html>
